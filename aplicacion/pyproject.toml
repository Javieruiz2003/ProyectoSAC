[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proyectosac-aplicacion"
version = "0.1.0"
description = "Aplicacion de escritorio para gestionar perfiles, captura y control del brazo."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sac_gui*"]
